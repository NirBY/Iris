name: Docker

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (blank = auto-compute YYYY.M.PATCH)"
        required: false

permissions:
  contents: read

jobs:
  docker:
    if: github.ref == 'refs/heads/main' # never publish :latest from a branch
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version tag after a successful image push
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # all tags needed to compute the version
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_VERSION" ]; then VERSION="$INPUT_VERSION"; else VERSION="$(./scripts/next-version.sh)"; fi
          [ -n "$VERSION" ] || { echo "::error::could not resolve a version"; exit 1; }
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}
          tags: |
            techblog/iris:latest
            techblog/iris:${{ steps.version.outputs.version }}
      # Tag only after the push succeeded, so a failed build never burns a version.
      - name: Tag published version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$VERSION"
          git push origin "$VERSION"
