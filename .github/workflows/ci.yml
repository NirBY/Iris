name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Install ffmpeg (media tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q

  postgres:
    # The whole suite against PostgreSQL, then a copy from SQLite into a second PostgreSQL database.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: iris
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 12
    env:
      IRIS_DATABASE_URL: postgresql://postgres:pw@127.0.0.1:5432/iris
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Install ffmpeg (media tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: uv sync --frozen
      - run: uv run pytest -q
      - name: Copy from SQLite into PostgreSQL
        env:
          IRIS_DATABASE_URL: ""
          IRIS_TEST_PG_URL: postgresql://postgres:pw@127.0.0.1:5432/iris_copy
        run: |
          PGPASSWORD=pw psql -h 127.0.0.1 -U postgres -c 'CREATE DATABASE iris_copy'
          uv run pytest -m integration tests/test_db_copy_real.py -q

  mysql:
    # The whole suite against MySQL, then a copy from SQLite into a second MySQL database.
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: pw
          MYSQL_DATABASE: iris
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -ppw" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      IRIS_DATABASE_URL: mysql://root:pw@127.0.0.1:3306/iris
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Install ffmpeg (media tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: uv sync --frozen
      - run: uv run pytest -q
      - name: Copy from SQLite into MySQL
        env:
          IRIS_DATABASE_URL: ""
          IRIS_TEST_MYSQL_URL: mysql://root:pw@127.0.0.1:3306/iris_copy
        run: |
          mysql -h 127.0.0.1 -uroot -ppw -e 'CREATE DATABASE iris_copy CHARACTER SET utf8mb4'
          uv run pytest -m integration tests/test_db_copy_real.py -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

  image:
    # Build both architectures without pushing, so arm64 breakage is caught before merge.
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build amd64 and load for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: iris:ci
          cache-from: type=gha
      - name: Smoke test
        run: |
          set -euo pipefail
          docker run -d --name iris -p 8080:8080 \
            -e IRIS_SECRET_KEY="$(openssl rand -base64 32)" \
            -e IRIS_ADMIN_USERNAME=admin -e IRIS_ADMIN_PASSWORD=ci-password-1 \
            -e IRIS_PUBLIC_BASE_URL=http://localhost:8080 iris:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/api/health && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/api/health
          docker exec iris ffmpeg -version | head -1
          docker rm -f iris
      - name: Build amd64 + arm64 (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
