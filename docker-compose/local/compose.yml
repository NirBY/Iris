# Build the complete reviewed Iris revision before deploying this stack in Portainer.
services:
  iris:
    build:
      context: ../..
      args:
        VERSION: ${IRIS_BUILD_VERSION:-2026.10.0-beta.8}
    image: ${IRIS_IMAGE:-iris-local:2026.10.0-beta.8}
    ports: ["${IRIS_HTTP_PORT:-8182}:8080"]
    volumes: ["${IRIS_DATA_PATH:?Set a persistent data directory}:/data"]
    environment:
      IRIS_ALERT_CHANNEL: "${IRIS_ALERT_CHANNEL:-openwa}"
      IRIS_ALERT_RECIPIENTS: "${IRIS_ALERT_RECIPIENTS:-}"
      IRIS_TELEGRAM_BOT_TOKEN: "${IRIS_TELEGRAM_BOT_TOKEN:-}"
      IRIS_TELEGRAM_CHAT_ID: "${IRIS_TELEGRAM_CHAT_ID:-}"
      IRIS_GREENAPI_API_URL: "${IRIS_GREENAPI_API_URL:-}"
      IRIS_GREENAPI_MEDIA_URL: "${IRIS_GREENAPI_MEDIA_URL:-}"
      IRIS_GREENAPI_INSTANCE_ID: "${IRIS_GREENAPI_INSTANCE_ID:-}"
      IRIS_GREENAPI_TOKEN: "${IRIS_GREENAPI_TOKEN:-}"
      IRIS_SMTP_HOST: "${IRIS_SMTP_HOST:-}"
      IRIS_SMTP_PORT: "${IRIS_SMTP_PORT:-587}"
      IRIS_SMTP_TLS: "${IRIS_SMTP_TLS:-starttls}"
      IRIS_SMTP_USERNAME: "${IRIS_SMTP_USERNAME:-}"
      IRIS_SMTP_PASSWORD: "${IRIS_SMTP_PASSWORD:-}"
      IRIS_SMTP_SENDER: "${IRIS_SMTP_SENDER:-}"
      IRIS_SECRET_KEY: ${IRIS_SECRET_KEY:?required}
      IRIS_ADMIN_USERNAME: ${IRIS_ADMIN_USERNAME:-admin}
      IRIS_ADMIN_PASSWORD: ${IRIS_ADMIN_PASSWORD:?required}
      OPENWA_URL: ${OPENWA_URL:-}
      OPENWA_API_KEY: ${OPENWA_API_KEY:-}
      IRIS_PUBLIC_BASE_URL: ${IRIS_PUBLIC_BASE_URL:?required}
      IRIS_METRICS_TOKEN: ${IRIS_METRICS_TOKEN:?required}
      IRIS_CLASSIFICATION_PROVIDER: ${IRIS_CLASSIFICATION_PROVIDER:-openai}
      IRIS_OLLAMA_BASE_URL: ${IRIS_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      IRIS_OLLAMA_MODEL: ${IRIS_OLLAMA_MODEL:-qwen3.5:9b-q8_0}
      IRIS_WHISPER_URL: ${IRIS_WHISPER_URL:-}
      # Optional explicit choice: openai, cloudflare or local_whisper. Omit to infer from URL/DB.
      # IRIS_TRANSCRIPTION_PROVIDER: ${IRIS_TRANSCRIPTION_PROVIDER}
      IRIS_WHISPER_API_KEY: ${IRIS_WHISPER_API_KEY:-}
      IRIS_WHISPER_MODEL: ${IRIS_WHISPER_MODEL:-auto}
      IRIS_WHISPER_FALLBACK_MODEL: ${IRIS_WHISPER_FALLBACK_MODEL:-}
      IRIS_LOCAL_SAFETY_MODE: ${IRIS_LOCAL_SAFETY_MODE:-false}
      IRIS_WORKERS: ${IRIS_WORKERS:-1}
      IRIS_DELIVERY_WORKERS: ${IRIS_DELIVERY_WORKERS:-0}
      IRIS_JOB_HEARTBEAT_SECONDS: ${IRIS_JOB_HEARTBEAT_SECONDS:-0}
      IRIS_MONITORING_SILENCE_MINUTES: ${IRIS_MONITORING_SILENCE_MINUTES:-0}
      IRIS_REQUIRE_WEBHOOK_SIGNATURES: ${IRIS_REQUIRE_WEBHOOK_SIGNATURES:-false}
      IRIS_LOG_LEVEL: ${IRIS_LOG_LEVEL:-INFO}
      IRIS_LOG_JSON: ${IRIS_LOG_JSON:-false}
      IRIS_FORWARDED_ALLOW_IPS: ${IRIS_FORWARDED_ALLOW_IPS:-127.0.0.1}
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped
    depends_on:
      openwa:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    pids_limit: 256
    mem_limit: 1g
    labels:
      # Enable only for a published, tested image from your own registry.
      com.centurylinklabs.watchtower.enable: ${IRIS_AUTO_UPDATE:-false}
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}
  openwa:
    image: ${OPENWA_IMAGE:?Set a reviewed OpenWA image tag or digest}
    ports: ["${OPENWA_BIND_IP:-127.0.0.1}:${OPENWA_HTTP_PORT:-2785}:2785"]
    volumes: ["${OPENWA_DATA_PATH:?Set a persistent session directory}:/app/data"]
    environment:
      NODE_ENV: production
      ENABLE_SWAGGER: "false"
      WEBHOOK_SSRF_PROTECT: "true"
      SSRF_ALLOWED_HOSTS: iris
      API_KEY_PEPPER: ${OPENWA_API_KEY_PEPPER:?Set before creating API keys}
      HOME: /tmp
    restart: unless-stopped
    tmpfs: [/tmp]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, KILL, SETGID, SETUID]
    pids_limit: 2048
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:2785/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    mem_limit: 2g
    labels:
      com.centurylinklabs.watchtower.enable: ${OPENWA_AUTO_UPDATE:-false}
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}
