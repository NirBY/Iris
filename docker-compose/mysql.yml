# Iris with MySQL 8.4. Iris waits for the database to be healthy, then creates its own tables.
#   docker compose -f mysql.yml up -d
name: iris
services:
  iris:
    image: ${IRIS_IMAGE:-techblog/iris:latest}
    container_name: iris
    ports: ["${IRIS_PORT:-8080}:8080"]
    volumes:
      - iris-data:/data   # kept media and temporary files (the messages live in MySQL)
    environment:
      IRIS_SECRET_KEY: ${IRIS_SECRET_KEY:?set IRIS_SECRET_KEY in .env (openssl rand -base64 32)}
      IRIS_ADMIN_USERNAME: ${IRIS_ADMIN_USERNAME:-admin}
      IRIS_ADMIN_PASSWORD: ${IRIS_ADMIN_PASSWORD:?set IRIS_ADMIN_PASSWORD in .env}
      IRIS_PUBLIC_BASE_URL: ${IRIS_PUBLIC_BASE_URL:?set IRIS_PUBLIC_BASE_URL in .env}
      IRIS_DATABASE_URL: mysql://iris:${DB_PASSWORD:?set DB_PASSWORD in .env}@mysql:3306/iris
      IRIS_LOG_LEVEL: INFO
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: iris-mysql
    # Iris stores Hebrew, emoji and other non-Latin text: the database must be utf8mb4.
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_DATABASE: iris
      MYSQL_USER: iris
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped
volumes:
  iris-data:
  mysql-data:
