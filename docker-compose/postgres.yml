# Iris with PostgreSQL 16. Iris waits for the database to be healthy, then creates its own tables.
#   docker compose -f postgres.yml up -d
name: iris
services:
  iris:
    image: ${IRIS_IMAGE:-techblog/iris:latest}
    container_name: iris
    ports: ["${IRIS_PORT:-8080}:8080"]
    volumes:
      - iris-data:/data   # kept media and temporary files (the messages live in PostgreSQL)
    environment:
      IRIS_SECRET_KEY: ${IRIS_SECRET_KEY:?set IRIS_SECRET_KEY in .env (openssl rand -base64 32)}
      IRIS_ADMIN_USERNAME: ${IRIS_ADMIN_USERNAME:-admin}
      IRIS_ADMIN_PASSWORD: ${IRIS_ADMIN_PASSWORD:?set IRIS_ADMIN_PASSWORD in .env}
      IRIS_PUBLIC_BASE_URL: ${IRIS_PUBLIC_BASE_URL:?set IRIS_PUBLIC_BASE_URL in .env}
      IRIS_DATABASE_URL: postgresql://iris:${DB_PASSWORD:?set DB_PASSWORD in .env}@postgres:5432/iris
      IRIS_LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: iris-postgres
    environment:
      POSTGRES_DB: iris
      POSTGRES_USER: iris
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iris -d iris"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
volumes:
  iris-data:
  postgres-data:
