[project]
name = "iris"
version = "0.0.0"
description = "Self-hosted WhatsApp safety monitor for kids."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic-settings",
  "loguru",
  "sqlalchemy[asyncio]",
  "aiosqlite",
  "alembic",
  "httpx",
  "cryptography",
  "argon2-cffi",
  "itsdangerous",
  "prometheus-client",
  "tzdata>=2026.5",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "respx", "ruff", "mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
strict = true
packages = ["app"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: hits real external services (needs TEST_* env vars)"]
addopts = "-m 'not integration'"

[tool.ruff.lint.per-file-ignores]
"app/db/fts.py" = ["E501"]
"tests/test_db.py" = ["E501"]
